name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Test (race detector)
        env:
          SIMGO_OUT: ${{ runner.temp }}/simgo-traces
        run: go test -race -count=1 ./...

      - name: Upload failing traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: simgo-traces
          path: ${{ runner.temp }}/simgo-traces
          if-no-files-found: ignore
